name: build-and-release
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@699bb18358f12c5b78b37bb0111d3a0e2276e0e2
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build the app
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Prepare release APK
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          cp "$APK" app/build/outputs/apk/release/Aegis-release-unsigned.apk
      - name: Publish latest build under fixed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view release >/dev/null 2>&1; then
            gh release delete release --yes --cleanup-tag
          fi
          gh release create release app/build/outputs/apk/release/Aegis-release-unsigned.apk --title release --notes "Latest automatic unsigned release built from main at ${GITHUB_SHA}." --target "${GITHUB_SHA}"
